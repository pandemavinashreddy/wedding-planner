<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandem's Wedding Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --maroon: #630d16; --gold: #c5a059; --ivory: #fdfcf0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--ivory); color: #1a1a1a; }
        .serif { font-family: 'Playfair Display', serif; }
        .glass-header { background: var(--maroon); border-bottom: 4px solid var(--gold); }
        .nav-item { color: white; opacity: 0.7; font-weight: 600; transition: 0.3s; padding: 10px; border-radius: 8px; }
        .nav-item.active { opacity: 1; background: rgba(255,255,255,0.1); color: var(--gold); }
        .card-luxury { background: white; border: 1px solid #e5e7eb; border-radius: 1.25rem; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .btn-maroon { background: var(--maroon); color: white; padding: 12px 24px; border-radius: 10px; font-weight: 700; }
        .loader { border-top-color: var(--maroon); animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="pb-20">

    <div id="loading-overlay" class="fixed inset-0 bg-white z-[200] flex flex-col items-center justify-center">
        <div class="loader w-12 h-12 border-4 border-gray-200 rounded-full mb-4"></div>
        <p class="serif text-maroon animate-pulse">Initializing Pandem's Suite...</p>
    </div>

    <!-- HEADER -->
    <header class="glass-header sticky top-0 z-50 px-4 py-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center space-x-4 mb-4 md:mb-0">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Ganesha_sketch.svg/1024px-Ganesha_sketch.svg.png" 
                     class="w-14 h-14 bg-white rounded-full p-1 border-2 border-gold shadow-md">
                <div>
                    <h1 class="serif text-white text-2xl uppercase">Pandem's Wedding</h1>
                    <p class="text-[10px] text-white/70 uppercase tracking-widest font-bold">Smart Event Management</p>
                </div>
            </div>
            <nav class="flex space-x-1 md:space-x-4">
                <button onclick="navigate('events')" class="nav-item active" id="n-events">Rituals</button>
                <button onclick="navigate('budget')" class="nav-item" id="n-budget">Expenses</button>
                <button onclick="navigate('fleet')" class="nav-item" id="n-fleet">Logistics</button>
                <button onclick="navigate('settings')" class="nav-item" id="n-settings"><i class="fa-solid fa-gear"></i></button>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-8">
        
        <!-- RITUALS SECTION -->
        <section id="view-events" class="view-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="serif text-2xl text-maroon">Wedding Rituals</h2>
                <button onclick="openModal('ritual')" class="btn-maroon text-sm">+ Add Ritual</button>
            </div>
            <div id="ritual-container" class="space-y-6"></div>
        </section>

        <!-- EXPENSE RECONCILIATION -->
        <section id="view-budget" class="view-content hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="serif text-2xl text-maroon">Expense Reconciliation</h2>
                <button onclick="openModal('expense')" class="btn-maroon text-sm">+ Add Expense</button>
            </div>
            <div class="card-luxury overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50 text-[11px] uppercase text-gray-600 font-bold border-b">
                        <tr>
                            <th class="p-4">Item/Event Link</th>
                            <th class="p-4">Est. Cost</th>
                            <th class="p-4">Actual Paid</th>
                            <th class="p-4">Details</th>
                            <th class="p-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="expense-table-body" class="text-sm"></tbody>
                </table>
            </div>
        </section>

        <!-- LOGISTICS -->
        <section id="view-fleet" class="view-content hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="serif text-2xl text-maroon">Fleet Logistics</h2>
                <button onclick="openModal('fleet')" class="btn-maroon text-sm">+ Add Vehicle</button>
            </div>
            <div id="fleet-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>

        <!-- SETTINGS -->
        <section id="view-settings" class="view-content hidden">
            <div class="card-luxury p-8 max-w-lg mx-auto">
                <h2 class="serif text-xl mb-4">Cloud Configuration</h2>
                <p class="text-xs text-gray-500 mb-4">Enter your Google Apps Script Web App URL below to sync across all family devices.</p>
                <input type="text" id="config-url" placeholder="https://script.google.com/..." class="w-full p-4 border rounded-xl mb-4 text-sm">
                <button onclick="saveConfig()" class="w-full btn-maroon">Save & Refresh Cloud</button>
            </div>
        </section>

    </main>

    <!-- MODAL -->
    <div id="modal" class="fixed inset-0 bg-black/80 hidden z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-lg rounded-3xl p-8 shadow-2xl relative">
            <h2 id="modal-title" class="serif text-2xl text-maroon mb-6">Form</h2>
            <div id="modal-form" class="space-y-4"></div>
            <div class="flex space-x-3 mt-8">
                <button onclick="closeModal()" class="flex-1 py-3 font-bold text-gray-400">Cancel</button>
                <button onclick="saveData()" class="flex-1 btn-maroon">Save & Sync</button>
            </div>
        </div>
    </div>

    <script>
        let weddingData = [];
        let editingId = null;
       const GAS_URL = () => 'https://script.google.com/macros/s/AKfycbzPthC9gGH6bQO4mDmbyWeibx7IcdJlK3DAe0pfDK1sH4ULxbGPe2Jtn4vLudZ8w2iR/exec';
        window.onload = async () => {
            if (GAS_URL()) {
                await fetchCloud();
            } else {
                document.getElementById('loading-overlay').classList.add('hidden');
                navigate('settings');
            }
        };

        async function fetchCloud() {
            try {
                const res = await fetch(GAS_URL());
                const data = await res.json();
                weddingData = Array.isArray(data) ? data : [];
                render();
            } catch (e) { alert("Cloud connection failed. Check your URL."); }
            document.getElementById('loading-overlay').classList.add('hidden');
        }

        async function pushCloud() {
            if (!GAS_URL()) return;
            await fetch(GAS_URL(), { method: 'POST', body: JSON.stringify(weddingData) });
        }

        function navigate(id) {
            document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('view-' + id).classList.remove('hidden');
            document.getElementById('n-' + id).classList.add('active');
            render();
        }

        function render() {
            renderRituals();
            renderExpenses();
            renderFleet();
        }

        function renderRituals() {
            const container = document.getElementById('ritual-container');
            const rituals = weddingData.filter(i => i.type === 'ritual');
            container.innerHTML = rituals.map(r => {
                const subItems = weddingData.filter(i => i.meta && i.meta.linkedTo === r.id);
                const totalRitualCost = subItems.reduce((s, i) => s + (Number(i.act) || 0), 0);
                
                return `
                <div class="card-luxury p-6 border-l-8 border-maroon">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="text-[10px] font-bold text-gold uppercase">${r.meta.time || 'No Time'} | ${r.meta.venue || 'No Venue'}</span>
                            <h3 class="serif text-xl">${r.name}</h3>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick="editItem('${r.id}')" class="text-blue-500 p-2"><i class="fa-solid fa-pencil"></i></button>
                            <button onclick="deleteItem('${r.id}')" class="text-red-300 p-2"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="bg-gray-50 rounded-xl p-4 space-y-2">
                        <p class="text-[10px] font-bold text-gray-400 uppercase">Related Expenses (${subItems.length})</p>
                        ${subItems.length ? subItems.map(si => `<div class="flex justify-between text-xs"><span>${si.name}</span><span class="font-bold">₹${si.act}</span></div>`).join('') : '<p class="text-xs italic text-gray-400">No linked expenses</p>'}
                        <div class="border-t pt-2 mt-2 flex justify-between font-bold text-maroon text-sm">
                            <span>Ritual Total:</span><span>₹${totalRitualCost}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function renderExpenses() {
            const tbody = document.getElementById('expense-table-body');
            const expenses = weddingData.filter(i => i.type === 'expense');
            tbody.innerHTML = expenses.map(e => {
                const ritual = weddingData.find(r => r.id === e.meta.linkedTo);
                return `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-4">
                        <div class="font-bold">${e.name}</div>
                        <div class="text-[9px] text-maroon font-bold uppercase">Linked: ${ritual ? ritual.name : 'General'}</div>
                    </td>
                    <td class="p-4 text-gray-500">₹${e.est || 0}</td>
                    <td class="p-4 font-bold text-green-700">₹${e.act || 0}</td>
                    <td class="p-4 text-[10px] text-gray-500 max-w-xs">${e.meta.groceries || 'None'}</td>
                    <td class="p-4 flex space-x-2">
                        <button onclick="editItem('${e.id}')" class="text-blue-500"><i class="fa-solid fa-pencil"></i></button>
                        <button onclick="deleteItem('${e.id}')" class="text-red-300"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
            }).join('');
        }

        function renderFleet() {
            const container = document.getElementById('fleet-container');
            const fleet = weddingData.filter(i => i.type === 'fleet');
            container.innerHTML = fleet.map(v => `
                <div class="card-luxury p-5 flex justify-between items-center">
                    <div>
                        <h4 class="font-bold text-maroon">${v.name}</h4>
                        <p class="text-[10px] text-gray-400 font-bold uppercase">${v.meta.driver || 'No Driver'}</p>
                    </div>
                    <div class="text-right flex items-center space-x-4">
                        <div class="text-xs font-bold text-green-600">₹${((v.meta.dist || 0) / (v.meta.mileage || 1) * 105).toFixed(0)}</div>
                        <button onclick="editItem('${v.id}')" class="text-blue-500"><i class="fa-solid fa-pencil"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function openModal(type, existingItem = null) {
            currentModalType = type;
            editingId = existingItem ? existingItem.id : null;
            const title = document.getElementById('modal-title');
            const form = document.getElementById('modal-form');
            document.getElementById('modal').classList.remove('hidden');

            const rituals = weddingData.filter(i => i.type === 'ritual');
            const ritualOptions = rituals.map(r => `<option value="${r.id}" ${existingItem?.meta?.linkedTo === r.id ? 'selected' : ''}>${r.name}</option>`).join('');

            if(type === 'ritual') {
                title.innerText = existingItem ? "Edit Ritual" : "Add Ritual";
                form.innerHTML = `
                    <input type="text" id="f-name" value="${existingItem?.name || ''}" placeholder="Ritual Name (e.g. Reception)" class="w-full p-4 border rounded-xl">
                    <input type="text" id="f-time" value="${existingItem?.meta?.time || ''}" placeholder="Date/Time" class="w-full p-4 border rounded-xl">
                    <input type="text" id="f-venue" value="${existingItem?.meta?.venue || ''}" placeholder="Venue" class="w-full p-4 border rounded-xl">
                `;
            } else if(type === 'expense') {
                title.innerText = existingItem ? "Edit Expense" : "Add Expense";
                form.innerHTML = `
                    <select id="f-link" class="w-full p-4 border rounded-xl bg-gray-50 font-bold text-maroon">
                        <option value="">General Expense (No Link)</option>
                        ${ritualOptions}
                    </select>
                    <input type="text" id="f-name" value="${existingItem?.name || ''}" placeholder="Expense Name (e.g. Mutton & Groceries)" class="w-full p-4 border rounded-xl">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="f-est" value="${existingItem?.est || ''}" placeholder="Est Cost" class="p-4 border rounded-xl">
                        <input type="number" id="f-act" value="${existingItem?.act || ''}" placeholder="Actual Paid" class="p-4 border rounded-xl">
                    </div>
                    <textarea id="f-groceries" placeholder="Detail Menu / Grocery List (Rice, Sweets, Alcohol, etc)" class="w-full p-4 border rounded-xl h-32">${existingItem?.meta?.groceries || ''}</textarea>
                `;
            } else if(type === 'fleet') {
                title.innerText = "Vehicle Details";
                form.innerHTML = `
                    <input type="text" id="f-name" value="${existingItem?.name || ''}" placeholder="Vehicle Name" class="w-full p-4 border rounded-xl">
                    <input type="text" id="f-driver" value="${existingItem?.meta?.driver || ''}" placeholder="Driver Details" class="w-full p-4 border rounded-xl">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="f-mileage" value="${existingItem?.meta?.mileage || ''}" placeholder="Mileage (KM/L)" class="p-4 border rounded-xl">
                        <input type="number" id="f-dist" value="${existingItem?.meta?.dist || ''}" placeholder="Total Distance" class="p-4 border rounded-xl">
                    </div>
                `;
            }
        }

        async function saveData() {
            const name = document.getElementById('f-name').value;
            if(!name) return alert("Enter a name");

            const item = {
                id: editingId || 'id_' + Date.now(),
                type: currentModalType,
                name: name,
                est: Number(document.getElementById('f-est')?.value) || 0,
                act: Number(document.getElementById('f-act')?.value) || 0,
                completed: false,
                meta: {}
            };

            if(currentModalType === 'ritual') {
                item.meta = { time: document.getElementById('f-time').value, venue: document.getElementById('f-venue').value };
            } else if(currentModalType === 'expense') {
                item.meta = { linkedTo: document.getElementById('f-link').value, groceries: document.getElementById('f-groceries').value };
            } else if(currentModalType === 'fleet') {
                item.meta = { driver: document.getElementById('f-driver').value, mileage: document.getElementById('f-mileage').value, dist: document.getElementById('f-dist').value };
            }

            if (editingId) {
                const idx = weddingData.findIndex(i => i.id === editingId);
                weddingData[idx] = item;
            } else {
                weddingData.push(item);
            }

            closeModal();
            render();
            await pushCloud();
        }

        function editItem(id) {
            const item = weddingData.find(i => i.id === id);
            openModal(item.type, item);
        }

        async function deleteItem(id) {
            if(confirm("Permanently delete?")) {
                weddingData = weddingData.filter(i => i.id !== id);
                render();
                await pushCloud();
            }
        }

        function saveConfig() {
            localStorage.setItem('pandem_gas_url', document.getElementById('config-url').value);
            location.reload();
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); editingId = null; }
    </script>
</body>
</html>
